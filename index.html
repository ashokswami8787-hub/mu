<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>



<style>
  body{
    margin:0;
    font-family: Inter, Arial, sans-serif;
    background: linear-gradient(135deg, #0d1b2a, #1b263b, #0d1b2a);
    color:#fff;
    display:flex;
    justify-content:center;
    padding:28px 16px;
  }

  .container{
    max-width:440px;
    width:100%;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    padding:24px;
    border-radius:18px;
    box-shadow:0 12px 28px rgba(0,0,0,0.35);
    text-align:center;
    overflow:hidden;
  }

  .hero-img {
    max-width: 100%;
    height: 200px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    border-radius: 54%;
}

  h1{
    font-size:24px;
    font-weight:800;
    margin-bottom:10px;
  }

  p{
    font-size:15px;
    color:#dbe2ef;
    line-height:1.6;
    margin-bottom:20px;
  }

  .points{
    text-align:left;
    margin:18px 0 20px;
    font-size:14px;
    color:#e2e8f0;
    padding-left:4px;
  }

  .points li{
    margin-bottom:8px;
    padding-left:6px;
  }

  .btn{
    background:#229ED9;
    color:#fff;
    padding:15px 1px;
    display:block;
    width:100%;
    border-radius:10px;
    font-size:17px;
    font-weight:700;
    text-decoration:none;
    box-shadow:0 10px 26px rgba(34,158,217,0.45);
    transition:0.2s;
  }

  .btn:hover{
    background:#1c8ec3;
  }

  .footer{
    margin-top:20px;
    font-size:12px;
    color:#b0b9c8;
    opacity:0.8;
  }
</style>

</head>
<body>

<div class="container">

  <!-- Photo -->
  <img src="mu.jpg" class="hero-img" alt="Telegram Channel">

  <!-- Title -->
  <h1>Work From Home 🔥</h1>



  <!-- Bullet Points / Policies -->
  <ul class="points">
    <li>✔ Work From Home Opportunities</li>
    <li>✔ Online Job Openings</li>
    <li>✔ Flexible Working Hours</li>
    <li>✔ Part-Time & Full-Time Roles</li>
  </ul>

  <!-- CTA -->
  <a href="https://t.me/+YDhiwztJC203YzY1" class="btn">
    Join Channel Now
  </a>

  <div class="footer">
    © 2025 • All rights reserved • Telegram Community
  </div>

</div>


</body></html>
